version: '3.8'

services:
  # Database Service: PostgreSQL with PostGIS extension for GIS data
  db:
    image: postgis/postgis:16-3.4
    container_name: roadtrack-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roaduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadpass123}
      POSTGRES_DB: ${POSTGRES_DB:-roadtrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically run initial migrations if the database is fresh
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - roadtrack-network

  # Backend Service: Python FastAPI
  backend:
    build:
      context: ./backend
    container_name: roadtrack-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-roaduser}:${POSTGRES_PASSWORD:-roadpass123}@db/${POSTGRES_DB:-roadtrack}
      - SECRET_KEY=${SECRET_KEY:-roadtrack-python-super-secret-key}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - roadtrack-network

  # Frontend & Node Backend Service: React with Vite + Express
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roadtrack-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - roadtrack-network

networks:
  roadtrack-network:
    driver: bridge

volumes:
  postgres_data:
